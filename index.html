<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Movie Search SPA</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="container mt-4">

    <h2 class="text-center text-white mb-4">
        Movie Search SPA
    </h2>


    <!-- Admin Login -->

    <div id="loginBox" class="card p-3 mb-4">

        <h5>Admin Login</h5>

        <input 
            id="username"
            class="form-control mb-2"
            placeholder="Username">


        <input 
            id="password"
            type="password"
            class="form-control mb-2"
            placeholder="Password">


        <button 
            id="loginBtn"
            class="btn btn-info">

            Login

        </button>


        <p id="msg" class="text-danger mt-2"></p>

    </div>



    <!-- Admin Panel -->

    <div id="adminPanel" class="card p-3 mb-4 d-none">

        <h5>Add Movie</h5>


        <input 
            id="title"
            class="form-control mb-2"
            placeholder="Movie Title">


        <input 
            id="poster"
            class="form-control mb-2"
            placeholder="Poster Image URL">


        <input 
            id="trailer"
            class="form-control mb-2"
            placeholder="Trailer URL">


        <input 
            id="keywords"
            class="form-control mb-2"
            placeholder="Keywords">


        <textarea 
            id="details"
            class="form-control mb-2"
            placeholder="Movie Details"></textarea>



        <button 
            id="addMovie"
            class="btn btn-info">

            Upload Movie

        </button>


    </div>




    <!-- Search -->

    <input 
        id="search"
        class="form-control mb-3"
        placeholder="Search movie">



    <!-- Movies -->

    <div id="movieList" class="row"></div>


</div>



<!-- JavaScript -->

<script src="app.js"></script>


</body>

</html>
